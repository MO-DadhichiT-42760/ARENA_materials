[project]
name = "arena-chapter0"
version = "0.1.0"
description = "Native macOS environment for ARENA chapter 0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.6,<2.16; platform_machine != 'x86_64'",
    "torchvision>=0.21,<0.31; platform_machine != 'x86_64'",
    # PyTorch 2.2 is the last official Intel Mac build.
    "torch==2.2.2; platform_machine == 'x86_64'",
    "torchvision==0.17.2; platform_machine == 'x86_64'",
    "numpy>=1.26,<2",
    "einops>=0.8,<0.9",
    "jaxtyping>=0.2.36,<0.4",
    "torchinfo>=1.8,<2",
    "torchmetrics[image]>=1.4,<1.7",
    "datasets>=3,<5",
    "pyarrow>=21,<22",  # NumPy 1.x wheels for the Intel Mac environment
    "wandb>=0.19,<1",
    "pandas>=2.2,<3",
    "scikit-learn>=1.5,<2",
    "pillow>=10,<13",
    "plotly>=6,<7",
    "anywidget>=0.9,<1",
    "ipywidgets>=8,<9",
    "rich>=13,<15",
    "tqdm>=4.66,<5",
    "jupyterlab>=4,<5",
    "ipykernel>=6.29,<8",
    "threadpoolctl>=3.5,<4",
]

[dependency-groups]
dev = ["pytest>=8,<10", "nbclient>=0.10,<0.11", "nbformat>=5.10,<6", "pyyaml>=6,<7", "tabulate>=0.9,<1", "ruff>=0.11,<1"]

[tool.uv]
package = false
# The remaining chapters still use requirements.txt. This project targets native Macs.
environments = ["sys_platform == 'darwin'"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["E722", "E731", "F722", "E402", "E741"]
extend-select = ["I"]

[tool.ruff.format]
# Markdown cells in infrastructure/chapters/*/master_*.py are wrapped in r'''...''',
# so the """ docstrings inside them need no escaping. Ruff's default quote-style
# ("double") rewrites each wrapper it safely can to r"""...""" while leaving the rest
# as r'''  -- an inconsistent mix that forces \'\'\' escapes back into the masters.
# "preserve" leaves existing quotes exactly as written.
quote-style = "preserve"
